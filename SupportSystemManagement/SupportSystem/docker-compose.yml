services:
  rabbitmq:
    image: rabbitmq:3-management  # Includes management UI
 
    hostname: rabbitmq
    ports:
      - "5672:5672"   # RabbitMQ connection port
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - ss-network

  ss-auth-server-api:
    image: narendransekar/ss-auth-server-api:latest
    build:
      context: ./SS.Auth.Server.API
      dockerfile: Dockerfile
   
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - UserApi__BaseUrl=http://ss-user-api:8080
    ports:
      - "5223:8080"
    depends_on:
      - ss-user-api
    networks:
      - ss-network

  ss-user-api:
    image: narendransekar/ss-user-api:latest
    build:
      context: .
      dockerfile: SS.User.API/Dockerfile
 
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=learningdatanaren.database.windows.net;Database=SupportSystem;User Id=narendran;Password=Admin@123;TrustServerCertificate=True;
      - RabbitMq__Host=rabbitmq
      - RabbitMq__VirtualHost=/
      - RabbitMq__Username=guest
      - RabbitMq__Password=guest
      - Cors__ReactUIOrigin=http://localhost:5145
    ports:
      - "5335:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - rabbitmq
    networks:
      - ss-network

  ss-ticket-api:
    image: narendransekar/ss-ticket-api:latest
    build:
      context: .
      dockerfile: SS.Ticket.API/Dockerfile
 
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=learningdatanaren.database.windows.net;Database=SupportSystem;User Id=narendran;Password=Admin@123;TrustServerCertificate=True;
      - RabbitMq__Host=rabbitmq
      - RabbitMq__VirtualHost=/
      - RabbitMq__Username=guest
      - RabbitMq__Password=guest
      - Cors__ReactUIOrigin=http://localhost:5145
    ports:
      - "5336:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - rabbitmq
    networks:
      - ss-network

  ss-email-api:
    image: narendransekar/ss-email-api:latest
    build:
      context: .
      dockerfile: SS.Email.API/SS.Email.API/Dockerfile

    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - RabbitMq__Host=rabbitmq
      - RabbitMq__VirtualHost=/
      - RabbitMq__Username=guest
      - RabbitMq__Password=guest
    ports:
      - "5337:8080"
    depends_on:
      - rabbitmq
    networks:
      - ss-network

  ss-gateway-api:
    image: narendransekar/ss-gateway-api:latest
    build:
      context: ./SS.Gateway.API
      dockerfile: Dockerfile
    
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker # selects ocelot.Docker.json (container hostnames, plain HTTP)
      - BaseUrl=http://ss-gateway-api:8080
    ports:
      - "5145:8080"
    depends_on:
      - ss-auth-server-api
      - ss-user-api
      - ss-ticket-api
    networks:
      - ss-network

  ss-react-ui:
    image: narendransekar/ss-react-ui:latest
    build:
      context: ./supportsystem.reactui
      dockerfile: Dockerfile
      args:
        REACT_APP_GATEWAY_URL: ${REACT_APP_GATEWAY_URL:-http://localhost:5145}
  
    environment:
      - REACT_APP_GATEWAY_URL=${REACT_APP_GATEWAY_URL:-http://localhost:5145}
    ports:
      - "3000:80"
    depends_on:
      - ss-gateway-api
    networks:
      - ss-network

networks:
  ss-network:
