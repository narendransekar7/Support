# Observability: every .NET service logs JSON to stdout (`docker compose logs -f <service>`).
# To also export logs/traces/metrics to Application Insights, set APPLICATIONINSIGHTS_CONNECTION_STRING
# in your shell or in a .env file next to this compose file (git-ignored) before `docker compose up`.
# "Sign in with Microsoft" (Entra ID, optional - see ARCHITECTURE.md "Authentication") is configured the same way:
#   ENTRA_TENANT_ID, ENTRA_API_CLIENT_ID, ENTRA_SPA_CLIENT_ID, ENTRA_API_SCOPE (ids only, no secrets)
# Message broker: MESSAGING_PROVIDER=Kafka (default) or RabbitMq - both brokers run, the services use the chosen one.
#   Kafka UI: http://localhost:8085   RabbitMQ management: http://localhost:15672 (guest/guest)
services:
  rabbitmq:
    image: rabbitmq:3-management  # Includes management UI
 
    hostname: rabbitmq
    ports:
      - "5672:5672"   # RabbitMQ connection port
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - ss-network

  # Kafka (single node, KRaft mode - no ZooKeeper). Services reach it at kafka:9092; your machine at localhost:9094.
  # Topics are created by the services (SS.Base.Messaging), not on first use. See docs/messaging/KAFKA.md.
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 168
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s
    networks:
      - ss-network

  # Browse topics, partitions, messages and consumer-group lag: http://localhost:8085
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: supportsystem
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
    networks:
      - ss-network

  # Rate-limit counters for ss-gateway-api (shared by all its replicas). No persistence needed:
  # losing the counters on restart only resets the current window.
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-ttl"]
    ports:
      - "6379:6379"
    networks:
      - ss-network

  ss-user-api:
    image: narendransekar/ss-user-api:latest
    build:
      context: .
      dockerfile: SS.User.API/Dockerfile
 
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - &db-connection ConnectionStrings__DefaultConnection=Server=learningdatanaren.database.windows.net;Database=SupportSystem;User Id=narendran;Password=Admin@123;TrustServerCertificate=True;
      - &messaging-provider Messaging__Provider=${MESSAGING_PROVIDER:-Kafka}
      - &kafka-bootstrap Messaging__Kafka__BootstrapServers=kafka:9092
      - RabbitMq__Host=rabbitmq
      - RabbitMq__VirtualHost=/
      - RabbitMq__Username=guest
      - RabbitMq__Password=guest
      - Cors__ReactUIOrigin=http://localhost:5145
      - Logging__Console__FormatterName=json
      - APPLICATIONINSIGHTS_CONNECTION_STRING=${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
    ports:
      - "5335:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rabbitmq:
        condition: service_started
      kafka:
        condition: service_healthy
    networks:
      - ss-network

  ss-auth-server-api:
    image: narendransekar/ss-auth-server-api:latest
    build:
      context: .
      dockerfile: SS.Auth.Server.API/Dockerfile
   
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - *db-connection   # same database as ss-user-api
      # Validates the Entra ID access token that "Sign in with Microsoft" exchanges at /api/auth/entra.
      - AzureAd__TenantId=${ENTRA_TENANT_ID:-}
      - AzureAd__ClientId=${ENTRA_API_CLIENT_ID:-}
      - Logging__Console__FormatterName=json
      - APPLICATIONINSIGHTS_CONNECTION_STRING=${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
    ports:
      - "5223:8080"
    networks:
      - ss-network

  ss-ticket-api:
    image: narendransekar/ss-ticket-api:latest
    build:
      context: .
      dockerfile: SS.Ticket.API/Dockerfile
 
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=learningdatanaren.database.windows.net;Database=SupportSystem;User Id=narendran;Password=Admin@123;TrustServerCertificate=True;
      - *messaging-provider
      - *kafka-bootstrap
      - RabbitMq__Host=rabbitmq
      - RabbitMq__VirtualHost=/
      - RabbitMq__Username=guest
      - RabbitMq__Password=guest
      - Cors__ReactUIOrigin=http://localhost:5145
      - Logging__Console__FormatterName=json
      - APPLICATIONINSIGHTS_CONNECTION_STRING=${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
    ports:
      - "5336:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rabbitmq:
        condition: service_started
      kafka:
        condition: service_healthy
    networks:
      - ss-network

  ss-email-api:
    image: narendransekar/ss-email-api:latest
    build:
      context: .
      dockerfile: SS.Email.API/SS.Email.API/Dockerfile

    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - *messaging-provider
      - *kafka-bootstrap
      - RabbitMq__Host=rabbitmq
      - RabbitMq__VirtualHost=/
      - RabbitMq__Username=guest
      - RabbitMq__Password=guest
      - Logging__Console__FormatterName=json
      - APPLICATIONINSIGHTS_CONNECTION_STRING=${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
    ports:
      - "5337:8080"
    depends_on:
      rabbitmq:
        condition: service_started
      kafka:
        condition: service_healthy
    networks:
      - ss-network

  # In-app notifications: consumes TicketCreated, serves /api/notification/* (through the gateway).
  ss-notification-api:
    image: narendransekar/ss-notification-api:latest
    build:
      context: .
      dockerfile: SS.Notification.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - *db-connection
      - *messaging-provider
      - *kafka-bootstrap
      - RabbitMq__Host=rabbitmq
      - RabbitMq__VirtualHost=/
      - RabbitMq__Username=guest
      - RabbitMq__Password=guest
      - Logging__Console__FormatterName=json
      - APPLICATIONINSIGHTS_CONNECTION_STRING=${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
    ports:
      - "5338:8080"
    depends_on:
      rabbitmq:
        condition: service_started
      kafka:
        condition: service_healthy
    networks:
      - ss-network

  # Audit trail: consumes the ticket-creation messages, serves /api/audit/* to Admins (through the gateway).
  ss-audit-api:
    image: narendransekar/ss-audit-api:latest
    build:
      context: .
      dockerfile: SS.Audit.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - *db-connection
      - *messaging-provider
      - *kafka-bootstrap
      - RabbitMq__Host=rabbitmq
      - RabbitMq__VirtualHost=/
      - RabbitMq__Username=guest
      - RabbitMq__Password=guest
      - Logging__Console__FormatterName=json
      - APPLICATIONINSIGHTS_CONNECTION_STRING=${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
    ports:
      - "5339:8080"
    depends_on:
      rabbitmq:
        condition: service_started
      kafka:
        condition: service_healthy
    networks:
      - ss-network

  ss-gateway-api:
    image: narendransekar/ss-gateway-api:latest
    build:
      context: .
      dockerfile: SS.Gateway.API/Dockerfile
    
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker # selects ocelot.Docker.json (container hostnames, plain HTTP)
      - BaseUrl=http://ss-gateway-api:8080
      - Redis__ConnectionString=redis:6379,connectTimeout=2000,syncTimeout=500,asyncTimeout=500
      - Logging__Console__FormatterName=json
      - APPLICATIONINSIGHTS_CONNECTION_STRING=${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
    ports:
      - "5145:8080"
    depends_on:
      - redis
      - ss-auth-server-api
      - ss-user-api
      - ss-ticket-api
      - ss-notification-api
      - ss-audit-api
    networks:
      - ss-network

  ss-react-ui:
    image: narendransekar/ss-react-ui:latest
    build:
      context: ./supportsystem.reactui
      dockerfile: Dockerfile
    environment:
      # Written into /config.js at container start (see supportsystem.reactui/docker-entrypoint.d) - empty disables browser telemetry.
      - APPLICATIONINSIGHTS_CONNECTION_STRING=${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
      # Microsoft Entra ID sign-in (MSAL, authorization code + PKCE). Register http://localhost/ as a SPA redirect URI.
      - ENTRA_TENANT_ID=${ENTRA_TENANT_ID:-}
      - ENTRA_SPA_CLIENT_ID=${ENTRA_SPA_CLIENT_ID:-}
      - ENTRA_API_SCOPE=${ENTRA_API_SCOPE:-}
    networks:
      - ss-network

  # Docker equivalent of the k8s ingress: the only thing the browser talks to.
  # /api -> ss-gateway-api, / -> ss-react-ui (routing lives in ./nginx/default.conf)
  ingress:
    image: nginx:1.26.2
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # Override with INGRESS_PORT when host port 80 is taken (e.g. IIS / http.sys on Windows).
      - "${INGRESS_PORT:-80}:80"
    depends_on:
      - ss-react-ui
      - ss-gateway-api
    networks:
      - ss-network

networks:
  ss-network:
