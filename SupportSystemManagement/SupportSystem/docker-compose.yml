# Observability: every .NET service logs JSON to stdout (`docker compose logs -f <service>`).
# To also export logs/traces/metrics to Application Insights, set APPLICATIONINSIGHTS_CONNECTION_STRING
# in your shell or in a .env file next to this compose file (git-ignored) before `docker compose up`.
# "Sign in with Microsoft" (Entra ID, optional - see ARCHITECTURE.md "Authentication") is configured the same way:
#   ENTRA_TENANT_ID, ENTRA_API_CLIENT_ID, ENTRA_SPA_CLIENT_ID, ENTRA_API_SCOPE (ids only, no secrets)
services:
  rabbitmq:
    image: rabbitmq:3-management  # Includes management UI
 
    hostname: rabbitmq
    ports:
      - "5672:5672"   # RabbitMQ connection port
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - ss-network

  ss-auth-server-api:
    image: narendransekar/ss-auth-server-api:latest
    build:
      context: .
      dockerfile: SS.Auth.Server.API/Dockerfile
   
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - UserApi__BaseUrl=http://ss-user-api:8080
      - Logging__Console__FormatterName=json
      - APPLICATIONINSIGHTS_CONNECTION_STRING=${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
    ports:
      - "5223:8080"
    depends_on:
      - ss-user-api
    networks:
      - ss-network

  ss-user-api:
    image: narendransekar/ss-user-api:latest
    build:
      context: .
      dockerfile: SS.User.API/Dockerfile
 
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=learningdatanaren.database.windows.net;Database=SupportSystem;User Id=narendran;Password=Admin@123;TrustServerCertificate=True;
      - RabbitMq__Host=rabbitmq
      - RabbitMq__VirtualHost=/
      - RabbitMq__Username=guest
      - RabbitMq__Password=guest
      - Cors__ReactUIOrigin=http://localhost:5145
      - AzureAd__TenantId=${ENTRA_TENANT_ID:-}
      - AzureAd__ClientId=${ENTRA_API_CLIENT_ID:-}
      - Logging__Console__FormatterName=json
      - APPLICATIONINSIGHTS_CONNECTION_STRING=${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
    ports:
      - "5335:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - rabbitmq
    networks:
      - ss-network

  ss-ticket-api:
    image: narendransekar/ss-ticket-api:latest
    build:
      context: .
      dockerfile: SS.Ticket.API/Dockerfile
 
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=learningdatanaren.database.windows.net;Database=SupportSystem;User Id=narendran;Password=Admin@123;TrustServerCertificate=True;
      - RabbitMq__Host=rabbitmq
      - RabbitMq__VirtualHost=/
      - RabbitMq__Username=guest
      - RabbitMq__Password=guest
      - Cors__ReactUIOrigin=http://localhost:5145
      - Logging__Console__FormatterName=json
      - APPLICATIONINSIGHTS_CONNECTION_STRING=${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
    ports:
      - "5336:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - rabbitmq
    networks:
      - ss-network

  ss-email-api:
    image: narendransekar/ss-email-api:latest
    build:
      context: .
      dockerfile: SS.Email.API/SS.Email.API/Dockerfile

    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - RabbitMq__Host=rabbitmq
      - RabbitMq__VirtualHost=/
      - RabbitMq__Username=guest
      - RabbitMq__Password=guest
      - Logging__Console__FormatterName=json
      - APPLICATIONINSIGHTS_CONNECTION_STRING=${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
    ports:
      - "5337:8080"
    depends_on:
      - rabbitmq
    networks:
      - ss-network

  ss-gateway-api:
    image: narendransekar/ss-gateway-api:latest
    build:
      context: .
      dockerfile: SS.Gateway.API/Dockerfile
    
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker # selects ocelot.Docker.json (container hostnames, plain HTTP)
      - BaseUrl=http://ss-gateway-api:8080
      - AzureAd__TenantId=${ENTRA_TENANT_ID:-}
      - AzureAd__ClientId=${ENTRA_API_CLIENT_ID:-}
      - Logging__Console__FormatterName=json
      - APPLICATIONINSIGHTS_CONNECTION_STRING=${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
    ports:
      - "5145:8080"
    depends_on:
      - ss-auth-server-api
      - ss-user-api
      - ss-ticket-api
    networks:
      - ss-network

  ss-react-ui:
    image: narendransekar/ss-react-ui:latest
    build:
      context: ./supportsystem.reactui
      dockerfile: Dockerfile
    environment:
      # Written into /config.js at container start (see supportsystem.reactui/docker-entrypoint.d) - empty disables browser telemetry.
      - APPLICATIONINSIGHTS_CONNECTION_STRING=${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
      # Microsoft Entra ID sign-in (MSAL, authorization code + PKCE). Register http://localhost/ as a SPA redirect URI.
      - ENTRA_TENANT_ID=${ENTRA_TENANT_ID:-}
      - ENTRA_SPA_CLIENT_ID=${ENTRA_SPA_CLIENT_ID:-}
      - ENTRA_API_SCOPE=${ENTRA_API_SCOPE:-}
    networks:
      - ss-network

  # Docker equivalent of the k8s ingress: the only thing the browser talks to.
  # /api -> ss-gateway-api, / -> ss-react-ui (routing lives in ./nginx/default.conf)
  ingress:
    image: nginx:1.26.2
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - ss-react-ui
      - ss-gateway-api
    networks:
      - ss-network

networks:
  ss-network:
