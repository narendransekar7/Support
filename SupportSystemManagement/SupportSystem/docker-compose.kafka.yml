# Kafka for local development (services run from Visual Studio / `dotnet run` with
# Messaging:Provider=Kafka and Messaging:Kafka:BootstrapServers=localhost:9092 - the appsettings default).
#
#   docker compose -f docker-compose.kafka.yml up -d
#
# Kafka UI: http://localhost:8085 - topics, partitions, messages, consumer groups and their lag.
# The full stack (docker-compose.yml) has its own Kafka; don't run both at once (same host ports).
services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: supportsystem-kafka
    ports:
      - "9092:9092"
    environment:
      # Single node in KRaft mode: one process is both broker and controller (no ZooKeeper).
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL: other containers (kafka-ui) - EXTERNAL: your machine (localhost:9092).
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # One broker, so internal topics can only have one copy.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created by the services (SS.Base.Messaging, 3 partitions each), not on first use.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
      # Keep messages 7 days - replay a consumer group from any point inside that window.
      KAFKA_LOG_RETENTION_HOURS: 168

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: supportsystem-kafka-ui
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: supportsystem
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
