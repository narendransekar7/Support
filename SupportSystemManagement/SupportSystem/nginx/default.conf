# Docker equivalent of the Kubernetes ingress: single entry point for the browser.
#   /api -> ss-gateway-api, everything else -> ss-react-ui
# To point at a different gateway, change the proxy_pass below.
server {
    listen 80;

    location /api/ {
        proxy_pass http://ss-gateway-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://ss-react-ui:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
