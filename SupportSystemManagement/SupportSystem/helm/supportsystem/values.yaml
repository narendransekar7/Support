# Default values for the Support System chart. Mirrors k8s/supportsystem.yaml - keep the two in sync.
#
# Resource names (ss-user-api, rabbitmq, supportsystem-config, ...) are fixed, not prefixed with the
# release name: ocelot.Docker.json routes by these Service names and k8s/monitoring.yaml selects on the
# `app` label. So install one release per namespace:
#
#   helm upgrade --install supportsystem ./helm/supportsystem -n supportsystem --create-namespace \
#     -f helm/supportsystem/values.secret.yaml

# ---------------------------------------------------------------------------
# Images
# ---------------------------------------------------------------------------
image:
  # Prefix put in front of every app image: Docker Hub user/org, or e.g. myacr.azurecr.io
  registry: narendransekar
  # Default tag for all app images; override per service with <service>.image.tag
  tag: latest
  # Always: with :latest, IfNotPresent leaves old nodes on a stale image while newly scaled
  # pods pull the new one, so replicas would run different versions.
  pullPolicy: Always

imagePullSecrets: []
#  - name: acr-pull

# ---------------------------------------------------------------------------
# Non-secret config shared across services -> ConfigMap "supportsystem-config"
# ---------------------------------------------------------------------------
config:
  # Message broker for every service: "Kafka" (default), "RabbitMq" or "AzureServiceBus" (env Messaging__Provider).
  # Kafka and RabbitMQ are deployed by default (kafka.enabled / rabbitmq.enabled); turn off the ones you don't use.
  # Azure Service Bus is a namespace in Azure (Standard tier or higher): set secrets.azureServiceBusConnectionString
  # or, with Microsoft Entra ID (workload identity), azureServiceBusNamespace below.
  messagingProvider: "Kafka"
  # Service name of the in-cluster Kafka (kafka.enabled) or an external cluster's bootstrap servers
  kafkaBootstrapServers: "kafka:9092"
  # "<namespace>.servicebus.windows.net" - only when no connection string is used
  azureServiceBusNamespace: ""
  # Service name of the in-cluster broker (rabbitmq.enabled) or the host of an external one
  rabbitmqHost: "rabbitmq"
  rabbitmqVhost: "/"
  # The browser only talks to the ingress (same origin), so no CORS/gateway URL is needed for the UI.
  # Set to the ingress URL if you also want to call the APIs from another origin.
  corsReactUiOrigin: "http://localhost:3000"
  gatewayBaseUrl: "http://ss-gateway-api:8080"
  # Logging (all .NET services): "json" = one structured line per entry on stdout.
  logConsoleFormat: "json"
  logLevelDefault: "Information"

# ---------------------------------------------------------------------------
# Gateway rate limiting (Redis-backed, shared by all ss-gateway-api replicas) -> ConfigMap "supportsystem-config"
#   auth: /api/auth/* per client IP.  api: every other /api/* route per signed-in user (per IP if anonymous).
#   Over the limit -> 429 + Retry-After. If Redis is unreachable the gateway fails open (no limiting).
#   The Redis connection string itself is secrets.redisConnectionString.
# ---------------------------------------------------------------------------
rateLimiting:
  enabled: true
  auth:
    permitLimit: 20
    windowSeconds: 60
  api:
    permitLimit: 300
    windowSeconds: 60

# ---------------------------------------------------------------------------
# Microsoft Entra ID sign-in (OpenID Connect), optional - empty = email/password login only -> ConfigMap "supportsystem-config"
#   Ids only, no secrets: the SPA is a public client (authorization code + PKCE) and the APIs
#   validate tokens against the tenant's published signing keys. See ARCHITECTURE.md "Authentication".
#   The ingress must be served over HTTPS on a host name registered as a SPA redirect URI.
# ---------------------------------------------------------------------------
entra:
  tenantId: ""        # Directory (tenant) id
  apiClientId: ""     # Client id of the "Support System API" app registration
  spaClientId: ""     # Client id of the "Support System SPA" app registration
  apiScope: ""        # e.g. api://<apiClientId>/access_as_user

# ---------------------------------------------------------------------------
# Secrets -> Secret "supportsystem-secrets"
#   Never commit real values here. Either:
#     - put them in values.secret.yaml (git-ignored) and pass it with -f, or
#     - create the Secret yourself (kubectl create secret ..., Key Vault CSI, sealed-secrets, ...)
#       and set existingSecret to its name - the chart then doesn't create one.
#   The Secret must contain the keys DB_CONNECTION_STRING, RABBITMQ_USERNAME, RABBITMQ_PASSWORD
#   and (optionally) APPLICATIONINSIGHTS_CONNECTION_STRING, JWT_SIGNING_KEY, REDIS_CONNECTION_STRING and
#   AZURE_SERVICE_BUS_CONNECTION_STRING.
# ---------------------------------------------------------------------------
secrets:
  existingSecret: ""
  dbConnectionString: ""
  rabbitmqUsername: "guest"
  rabbitmqPassword: "guest"
  # Application Insights connection string. Leave empty to disable OpenTelemetry export.
  applicationInsightsConnectionString: ""
  # HS256 key for the email/password login's tokens (SS.Auth.Server.API signs, Gateway + User API validate).
  # Empty = the development default in their appsettings.json - set a long random value for real deployments.
  jwtSigningKey: ""
  # StackExchange.Redis connection string for the gateway's rate limiter. Default = the in-cluster redis below;
  # for Azure Cache for Redis: "<name>.redis.cache.windows.net:6380,password=<key>,ssl=True,abortConnect=False"
  redisConnectionString: "redis:6379,connectTimeout=2000,syncTimeout=500,asyncTimeout=500"
  # Azure Service Bus (config.messagingProvider: AzureServiceBus): a shared access policy's connection string with
  # Manage rights - the services create their topics/subscriptions. Empty = use config.azureServiceBusNamespace.
  azureServiceBusConnectionString: ""

# ---------------------------------------------------------------------------
# RabbitMQ (single replica, no persistence - see k8s/README.md "Known gap")
# ---------------------------------------------------------------------------
rabbitmq:
  # Set false to use an external broker (then point config.rabbitmqHost at it)
  enabled: true
  image: rabbitmq:3-management
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

# ---------------------------------------------------------------------------
# Kafka (single broker, KRaft mode, no persistence - like RabbitMQ: a restart loses topics, messages
# and consumer offsets; the services recreate the topics). See docs/messaging/KAFKA.md.
# ---------------------------------------------------------------------------
kafka:
  # Set false to use an external cluster (then point config.kafkaBootstrapServers at it)
  enabled: true
  image: apache/kafka:3.9.1
  # Partitions of the topics the broker would create itself (the services create theirs with 3)
  numPartitions: 3
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

# ---------------------------------------------------------------------------
# Redis (single replica, no persistence) - only holds the gateway's rate-limit counters, which are
# short-lived, so losing them on a restart just resets the current window.
# ---------------------------------------------------------------------------
redis:
  # Set false to use an external Redis (e.g. Azure Cache for Redis) - then set secrets.redisConnectionString
  enabled: true
  image: redis:7.4-alpine
  maxmemory: 128mb
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 192Mi

# ---------------------------------------------------------------------------
# Defaults shared by every .NET API below (apis.*)
# ---------------------------------------------------------------------------
apiDefaults:
  httpPort: 8080
  # Prometheus /metrics on its own port - not exposed by the Services / the public Ingress
  metricsPort: 9464
  resources:
    requests:        # reserved for scheduling; the HPA's CPU % is measured against this
      cpu: 100m
      memory: 256Mi
    limits:          # CPU above this is throttled, memory above this is OOMKilled
      cpu: 500m
      memory: 512Mi
  startupProbe:      # gives .NET up to 60s to start before liveness kicks in
    httpGet:
      path: /health/live
      port: http
    periodSeconds: 2
    failureThreshold: 30
  readinessProbe:    # only route traffic to pods that are ready (important while scaling up)
    httpGet:
      path: /health/ready
      port: http
    periodSeconds: 10
    failureThreshold: 3
  livenessProbe:     # restart a hung process
    httpGet:
      path: /health/live
      port: http
    periodSeconds: 20
    failureThreshold: 3

# Spread replicas over nodes and zones so one node/zone failure can't take out every copy.
# ScheduleAnyway: prefer spreading, but still schedule if the cluster can't (e.g. 1 node left).
topologySpread:
  enabled: true
  topologyKeys:
    - kubernetes.io/hostname
    - topology.kubernetes.io/zone

# HPA scaling behaviour shared by every autoscaled Deployment
autoscalingBehavior:
  scaleUp:
    stabilizationWindowSeconds: 0     # react to spikes immediately
  scaleDown:
    stabilizationWindowSeconds: 300   # only scale down after 5 min of consistently lower load
    policies:
      - type: Pods
        value: 1                      # remove at most 1 pod per minute
        periodSeconds: 60

# ---------------------------------------------------------------------------
# .NET APIs
#   Per service:
#     enabled                 render this service at all
#     image.repository/tag    image name (prefixed with image.registry); tag defaults to image.tag
#     aspnetcoreEnvironment   ASPNETCORE_ENVIRONMENT
#     database                inject ConnectionStrings__DefaultConnection from the Secret
#     messaging               inject Messaging__Provider and the Kafka / Azure Service Bus settings (the broker switch)
#     rabbitmq                inject RabbitMq__Host/VirtualHost/Username/Password
#     cors                    inject Cors__ReactUIOrigin
#     jwt                     inject Jwt__SigningKey from the Secret's JWT_SIGNING_KEY (if present)
#     redis                   inject Redis__ConnectionString from the Secret's REDIS_CONNECTION_STRING (if present)
#     configEnv               extra env vars read from the ConfigMap ({ENV_NAME: CONFIGMAP_KEY})
#     extraEnv                extra raw env entries (list, as in a container spec)
#     resources               overrides apiDefaults.resources
#     replicaCount            used only when autoscaling.enabled is false
#     autoscaling             HorizontalPodAutoscaler on CPU (requires metrics-server)
#     pdb.enabled             PodDisruptionBudget minAvailable: 1 - keep off for single-replica
#                             services, or it blocks node drains / AKS upgrades
# ---------------------------------------------------------------------------
apis:
  ss-auth-server-api:
    enabled: true
    image:
      repository: ss-auth-server-api
      tag: ""
    aspnetcoreEnvironment: Development
    database: true
    messaging: false
    rabbitmq: false
    cors: false
    jwt: true
    redis: false
    configEnv:   # Entra ID token exchange at /api/auth/entra ("Sign in with Microsoft")
      AzureAd__TenantId: ENTRA_TENANT_ID
      AzureAd__ClientId: ENTRA_API_CLIENT_ID
    extraEnv: []
    resources: {}
    replicaCount: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
    pdb:
      enabled: true

  ss-user-api:
    enabled: true
    image:
      repository: ss-user-api
      tag: ""
    aspnetcoreEnvironment: Development
    database: true
    messaging: true
    rabbitmq: true
    cors: true
    jwt: true
    redis: false
    configEnv: {}
    extraEnv: []
    resources: {}
    replicaCount: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
    pdb:
      enabled: true

  # Saga consumers (RabbitMQ queues or Kafka consumer groups) and the saga state rows are safe with competing replicas
  ss-ticket-api:
    enabled: true
    image:
      repository: ss-ticket-api
      tag: ""
    aspnetcoreEnvironment: Development
    database: true
    messaging: true
    rabbitmq: true
    cors: true
    jwt: false
    redis: false
    configEnv: {}
    extraEnv: []
    resources: {}
    replicaCount: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
    pdb:
      enabled: true

  # RabbitMQ queue / Kafka consumer group - replicas share the work as competing consumers
  ss-email-api:
    enabled: true
    image:
      repository: ss-email-api
      tag: ""
    aspnetcoreEnvironment: Development
    database: false
    messaging: true
    rabbitmq: true
    cors: false
    jwt: false
    redis: false
    configEnv: {}
    extraEnv: []
    resources: {}
    replicaCount: 1
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 70
    pdb:
      enabled: false   # can run a single replica

  # In-app notifications: TicketCreated consumer + /api/notification/*.
  # Kafka consumer group - each topic has 3 partitions, so more than 3 replicas would sit idle.
  ss-notification-api:
    enabled: true
    image:
      repository: ss-notification-api
      tag: ""
    aspnetcoreEnvironment: Development
    database: true
    messaging: true
    rabbitmq: true
    cors: false
    jwt: false
    redis: false
    configEnv: {}
    extraEnv: []
    resources: {}
    replicaCount: 1
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 70
    pdb:
      enabled: false   # can run a single replica

  # Audit trail of the ticket-creation messages + Admin-only /api/audit/*
  ss-audit-api:
    enabled: true
    image:
      repository: ss-audit-api
      tag: ""
    aspnetcoreEnvironment: Development
    database: true
    messaging: true
    rabbitmq: true
    cors: false
    jwt: true
    redis: false
    configEnv: {}
    extraEnv: []
    resources: {}
    replicaCount: 1
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 70
    pdb:
      enabled: false   # can run a single replica

  # Every request goes through here; reached from outside only through the ingress at /api
  ss-gateway-api:
    enabled: true
    image:
      repository: ss-gateway-api
      tag: ""
    aspnetcoreEnvironment: Docker   # selects ocelot.Docker.json, which routes by these Service names
    database: false
    messaging: false
    rabbitmq: false
    cors: false
    jwt: true
    redis: true     # rate limiting (rateLimiting.* above)
    configEnv:
      BaseUrl: GATEWAY_BASE_URL
      RateLimiting__Enabled: RATE_LIMIT_ENABLED
      RateLimiting__Auth__PermitLimit: RATE_LIMIT_AUTH_PERMIT_LIMIT
      RateLimiting__Auth__WindowSeconds: RATE_LIMIT_AUTH_WINDOW_SECONDS
      RateLimiting__Api__PermitLimit: RATE_LIMIT_API_PERMIT_LIMIT
      RateLimiting__Api__WindowSeconds: RATE_LIMIT_API_WINDOW_SECONDS
    extraEnv: []
    resources: {}
    replicaCount: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 10
      targetCPUUtilizationPercentage: 70
    pdb:
      enabled: true

# ---------------------------------------------------------------------------
# React UI (nginx) - reached from outside only through the ingress at /
# ---------------------------------------------------------------------------
reactUi:
  enabled: true
  name: ss-react-ui
  image:
    repository: ss-react-ui
    tag: ""
  port: 80
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
  readinessProbe:
    httpGet:
      path: /
      port: http
    periodSeconds: 10
  livenessProbe:
    httpGet:
      path: /
      port: http
    periodSeconds: 20
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: true

# ---------------------------------------------------------------------------
# Ingress (single public entry point): /api -> ss-gateway-api, everything else -> ss-react-ui
#   className "nginx" = community ingress-nginx (k8s/README.md step 2);
#   "webapprouting.kubernetes.azure.com" = AKS application routing add-on.
# ---------------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  # Optional host name; empty = match any host (access by the load balancer IP)
  host: ""
  annotations: {}
  tls: []
  #  - secretName: supportsystem-tls
  #    hosts:
  #      - support.example.com

# ---------------------------------------------------------------------------
# Azure Monitor managed Prometheus PodMonitors (same as k8s/monitoring.yaml).
#   Only enable once the AKS metrics add-on is on - the azmonitoring.coreos.com CRD exists only then.
# ---------------------------------------------------------------------------
monitoring:
  podMonitors:
    enabled: false
    interval: 30s
