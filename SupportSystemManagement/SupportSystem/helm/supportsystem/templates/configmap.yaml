# Non-secret config shared across services (mirrors the plain env values in docker-compose.yml)
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "supportsystem.configMapName" . }}
  labels:
    {{- include "supportsystem.labels" . | nindent 4 }}
data:
  RABBITMQ_HOST: {{ .Values.config.rabbitmqHost | quote }}
  RABBITMQ_VHOST: {{ .Values.config.rabbitmqVhost | quote }}
  CORS_REACT_UI_ORIGIN: {{ .Values.config.corsReactUiOrigin | quote }}
  AUTH_USER_API_BASE_URL: {{ .Values.config.authUserApiBaseUrl | quote }}
  GATEWAY_BASE_URL: {{ .Values.config.gatewayBaseUrl | quote }}
  LOG_CONSOLE_FORMAT: {{ .Values.config.logConsoleFormat | quote }}
  LOG_LEVEL_DEFAULT: {{ .Values.config.logLevelDefault | quote }}
  ENTRA_TENANT_ID: {{ .Values.entra.tenantId | quote }}
  ENTRA_API_CLIENT_ID: {{ .Values.entra.apiClientId | quote }}
  ENTRA_SPA_CLIENT_ID: {{ .Values.entra.spaClientId | quote }}
  ENTRA_API_SCOPE: {{ .Values.entra.apiScope | quote }}
