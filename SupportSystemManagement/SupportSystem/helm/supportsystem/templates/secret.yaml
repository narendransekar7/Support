{{- /* Skipped when secrets.existingSecret points at a Secret created outside the chart. */ -}}
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "supportsystem.secretName" . }}
  labels:
    {{- include "supportsystem.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_CONNECTION_STRING: {{ required "secrets.dbConnectionString is required (or set secrets.existingSecret) - see values.yaml" .Values.secrets.dbConnectionString | quote }}
  RABBITMQ_USERNAME: {{ .Values.secrets.rabbitmqUsername | quote }}
  RABBITMQ_PASSWORD: {{ .Values.secrets.rabbitmqPassword | quote }}
  APPLICATIONINSIGHTS_CONNECTION_STRING: {{ .Values.secrets.applicationInsightsConnectionString | quote }}
{{- end }}
