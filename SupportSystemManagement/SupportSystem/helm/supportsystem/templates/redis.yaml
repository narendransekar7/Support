{{- if .Values.redis.enabled }}
# redis - the gateway's rate-limit counters. Deliberately single replica and not persisted: the counters
# expire within two windows anyway, and while redis is away the gateway fails open (no limiting).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    {{- include "supportsystem.componentLabels" (dict "root" $ "name" "redis") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        {{- include "supportsystem.componentLabels" (dict "root" $ "name" "redis") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          # No RDB/AOF persistence; evict the soonest-expiring counters if memory ever runs out.
          args: ["--save", "", "--appendonly", "no", "--maxmemory", {{ .Values.redis.maxmemory | quote }}, "--maxmemory-policy", "volatile-ttl"]
          ports:
            - containerPort: 6379
              name: redis
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    {{- include "supportsystem.componentLabels" (dict "root" $ "name" "redis") | nindent 4 }}
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
{{- end }}
