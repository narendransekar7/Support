{{- /*
One Deployment + Service (+ HPA / PDB) per entry in .Values.apis - the .NET services.
*/ -}}
{{- $root := . }}
{{- $defaults := .Values.apiDefaults }}
{{- $configMap := include "supportsystem.configMapName" . }}
{{- $secretName := include "supportsystem.secretName" . }}
{{- range $name, $svc := .Values.apis }}
{{- if $svc.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "supportsystem.componentLabels" (dict "root" $root "name" $name) | nindent 4 }}
spec:
  {{- /* With an HPA the replica count is owned by it - setting it here would reset it on every upgrade. */}}
  {{- if not $svc.autoscaling.enabled }}
  replicas: {{ $svc.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "supportsystem.componentLabels" (dict "root" $root "name" $name) | nindent 8 }}
      annotations:
        {{- include "supportsystem.podChecksums" $root | nindent 8 }}
    spec:
      {{- include "supportsystem.topologySpread" (dict "root" $root "name" $name) | nindent 6 }}
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "supportsystem.image" (dict "root" $root "image" $svc.image) }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          ports:
            - containerPort: {{ $defaults.httpPort }}
              name: http
            - containerPort: {{ $defaults.metricsPort }}   # Prometheus /metrics only - not exposed by the Service
              name: metrics
          resources:
            {{- toYaml (default $defaults.resources $svc.resources) | nindent 12 }}
          startupProbe:
            {{- toYaml $defaults.startupProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml $defaults.readinessProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml $defaults.livenessProbe | nindent 12 }}
          env:
            # Serve the app on the http port and Prometheus /metrics on a separate one (see UseSupportSystemMetrics),
            # so metrics aren't reachable through the Services / the public Ingress.
            - name: Kestrel__Endpoints__Http__Url
              value: "http://+:{{ $defaults.httpPort }}"
            - name: Kestrel__Endpoints__Metrics__Url
              value: "http://+:{{ $defaults.metricsPort }}"
            - name: Metrics__Port
              value: {{ $defaults.metricsPort | quote }}
            - name: Logging__Console__FormatterName
              valueFrom:
                configMapKeyRef:
                  name: {{ $configMap }}
                  key: LOG_CONSOLE_FORMAT
            - name: Logging__LogLevel__Default
              valueFrom:
                configMapKeyRef:
                  name: {{ $configMap }}
                  key: LOG_LEVEL_DEFAULT
            - name: APPLICATIONINSIGHTS_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: APPLICATIONINSIGHTS_CONNECTION_STRING
                  optional: true
            - name: ASPNETCORE_ENVIRONMENT
              value: {{ $svc.aspnetcoreEnvironment | quote }}
            {{- range $envName, $key := $svc.configEnv }}
            - name: {{ $envName }}
              valueFrom:
                configMapKeyRef:
                  name: {{ $configMap }}
                  key: {{ $key }}
            {{- end }}
            {{- if $svc.database }}
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: DB_CONNECTION_STRING
            {{- end }}
            {{- if $svc.rabbitmq }}
            - name: RabbitMq__Host
              valueFrom:
                configMapKeyRef:
                  name: {{ $configMap }}
                  key: RABBITMQ_HOST
            - name: RabbitMq__VirtualHost
              valueFrom:
                configMapKeyRef:
                  name: {{ $configMap }}
                  key: RABBITMQ_VHOST
            - name: RabbitMq__Username
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: RABBITMQ_USERNAME
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: RABBITMQ_PASSWORD
            {{- end }}
            {{- if $svc.jwt }}
            - name: Jwt__SigningKey
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: JWT_SIGNING_KEY
                  optional: true   # absent = appsettings.json development default
            {{- end }}
            {{- if $svc.cors }}
            - name: Cors__ReactUIOrigin
              valueFrom:
                configMapKeyRef:
                  name: {{ $configMap }}
                  key: CORS_REACT_UI_ORIGIN
            {{- end }}
            {{- with $svc.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "supportsystem.componentLabels" (dict "root" $root "name" $name) | nindent 4 }}
spec:
  selector:
    app: {{ $name }}
  ports:
    - name: http
      port: {{ $defaults.httpPort }}
      targetPort: http
{{- include "supportsystem.scaling" (dict "root" $root "name" $name "svc" $svc) }}
{{- end }}
{{- end }}
