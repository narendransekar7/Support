# Copy to values.secret.yaml (git-ignored) and fill in, then pass it with
#   helm upgrade --install ... -f helm/supportsystem/values.secret.yaml
# Never commit the filled-in copy.
secrets:
  dbConnectionString: "Server=<server>.database.windows.net;Database=SupportSystem;User Id=<user>;Password=<password>;TrustServerCertificate=True;"
  rabbitmqUsername: "guest"
  rabbitmqPassword: "guest"
  # Azure portal -> Application Insights -> Overview. Leave empty to disable OpenTelemetry export.
  applicationInsightsConnectionString: ""
  # HS256 key for the password login's tokens; empty = development default. e.g. `openssl rand -base64 32`
  jwtSigningKey: ""

# Microsoft Entra ID sign-in - not secrets, but environment-specific, so set them here too
# (Jenkins passes this file to every deploy). See ARCHITECTURE.md "Authentication".
entra:
  tenantId: "<directory-tenant-id>"
  apiClientId: "<support-system-api-client-id>"
  spaClientId: "<support-system-spa-client-id>"
  apiScope: "api://<support-system-api-client-id>/access_as_user"
