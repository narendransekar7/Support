# Production defaults for the Support System's Kafka cluster (Strimzi). See k8s/README.md "Kafka in production".
#
#   helm upgrade --install strimzi-kafka-operator oci://quay.io/strimzi-helm/strimzi-kafka-operator --version 1.2.0 \
#     -n kafka-operator --create-namespace --set watchNamespaces="{supportsystem}"
#   helm upgrade --install supportsystem-kafka ./helm/supportsystem-kafka -n supportsystem --create-namespace
#   kubectl -n supportsystem wait kafka/support-kafka --for=condition=Ready --timeout=20m
#
# Then deploy the app chart with kafka.mode=strimzi (helm/supportsystem/values.production.yaml).

# Name of the Kafka custom resource. Strimzi derives everything from it: the bootstrap Service
# "<clusterName>-kafka-bootstrap:9093" and the CA Secret "<clusterName>-cluster-ca-cert" the app chart uses.
clusterName: support-kafka

kafka:
  version: 4.3.1
  metadataVersion: 4.3-IV0
  # Brokers. Each is also a KRaft controller (combined roles) - plenty for this load; separate controller
  # nodes only pay off for large clusters.
  replicas: 3
  roles: [controller, broker]
  resources:
    requests: { cpu: "1", memory: 4Gi }
    limits: { memory: 4Gi }
  # Heap about half the container memory - Kafka relies on the OS page cache for the rest.
  jvmOptions:
    "-Xms": 2048m
    "-Xmx": 2048m
  storage:
    size: 100Gi                 # grow later by raising this (the StorageClass allows expansion)
    class: kafka-premium-zrs    # created below (storageClass.create)
    deleteClaim: false          # keep the disks if the cluster resource is deleted
  # Rack awareness: replicas of each partition land in different zones. Empty topologyKey = off
  # (e.g. a single-zone or local cluster without the zone node label).
  rack:
    topologyKey: topology.kubernetes.io/zone
  # Where the broker pods run: the dedicated, tainted "kafkapool" node pool (scripts/aks-kafka-nodepool.sh),
  # one per zone. Empty nodeSelector/tolerations = any node.
  scheduling:
    nodeSelector:
      workload: kafka
    tolerations:
      - key: dedicated
        operator: Equal
        value: kafka
        effect: NoSchedule
    spreadAcrossZones: true     # at most one broker more in any zone than in another (DoNotSchedule)
  config:
    default.replication.factor: 3
    min.insync.replicas: 2      # with acks=all (the services' producers) a write needs 2 of 3 copies
    offsets.topic.replication.factor: 3
    transaction.state.log.replication.factor: 3
    transaction.state.log.min.isr: 2
    auto.create.topics.enable: false   # topics come from topics.names below (KafkaTopic resources)
    num.partitions: 6
    log.retention.hours: 168

# Zone-redundant Premium SSD (Azure Disk CSI): a broker's disk survives the loss of its zone and can follow the
# broker to another zone. Cluster-scoped - create it in one release only (the production one).
storageClass:
  create: true
  name: kafka-premium-zrs
  provisioner: disk.csi.azure.com
  parameters:
    skuName: Premium_ZRS
  reclaimPolicy: Retain         # a deleted claim keeps its disk until someone removes it on purpose
  volumeBindingMode: WaitForFirstConsumer
  allowVolumeExpansion: true

# One KafkaTopic per message type plus its ".dlt" dead-letter topic - the names SS.Base.Messaging uses
# ("<prefix>.<message-type-in-kebab-case>"). Add a message type here when a service starts publishing it.
topics:
  prefix: support
  partitions: 6                 # the most consumers of one group that can work in parallel (keep HPAs at or below)
  replicas: 3
  minInsyncReplicas: 2
  retentionMs: 604800000        # 7 days
  deadLetterRetentionMs: 2592000000   # 30 days - time to inspect and replay failures
  names:
    - ticket-created
    - engineer-assigned
    - assign-engineer-failed
    - sla-reserved
    - assign-engineer-command
    - reserve-sla-command
    - delete-ticket-command
    - send-ticket-creation-failed-email
    - user-created

# One SCRAM-SHA-512 login per service, named like the app chart's Deployment, allowed only what that service does:
#   produces: Write/Describe on those topics
#   consumes: Read/Describe on those topics, Write/Describe on their ".dlt" topics, Read on its "<name>." consumer groups
# Strimzi writes each password to a Secret of the same name, which the app chart's pods read.
users:
  ss-ticket-api:
    produces: [ticket-created, assign-engineer-command, engineer-assigned, assign-engineer-failed,
               reserve-sla-command, sla-reserved, delete-ticket-command, send-ticket-creation-failed-email]
    consumes: [ticket-created, engineer-assigned, assign-engineer-failed, sla-reserved,
               assign-engineer-command, reserve-sla-command, delete-ticket-command]
  ss-user-api:
    produces: [user-created]
    consumes: []
  ss-email-api:
    produces: []
    consumes: [ticket-created, user-created, send-ticket-creation-failed-email]
  ss-notification-api:
    produces: []
    consumes: [ticket-created, user-created]
  ss-audit-api:
    produces: []
    consumes: [ticket-created, engineer-assigned, assign-engineer-failed, sla-reserved, user-created]

entityOperator:
  topicOperator:
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { memory: 512Mi }
  userOperator:
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { memory: 512Mi }

# Moves partitions between brokers when you add/remove brokers or they get unbalanced (KafkaRebalance resources).
cruiseControl:
  enabled: true
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { memory: 1Gi }

# Consumer-group lag and topic offsets as Prometheus metrics - the number to alert on.
kafkaExporter:
  enabled: true
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }

# Broker JMX metrics (files/kafka-metrics-config.yml - Strimzi's rules, matching its Grafana dashboards).
metrics:
  enabled: true

# Azure Monitor managed Prometheus PodMonitors for the brokers and Kafka Exporter (same CRD as the app chart's
# monitoring.podMonitors - only enable once the AKS metrics add-on is on).
monitoring:
  podMonitors:
    enabled: false
    interval: 30s

# Kafka UI (kafbat) for operators: topics, messages, consumer lag, dead letters, offset resets. ClusterIP only -
#   kubectl -n supportsystem port-forward svc/support-kafka-ui 8085:8080   then http://localhost:8085
ui:
  enabled: true
  image: ghcr.io/kafbat/kafka-ui:v1.2.0
  resources:
    requests: { cpu: 50m, memory: 384Mi }
    limits: { memory: 768Mi }
