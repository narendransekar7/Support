{{- if .Values.ui.enabled }}
{{- $name := printf "%s-ui" .Values.clusterName }}
# Kafka UI (kafbat) for operators - not exposed outside the cluster:
#   kubectl -n {{ .Release.Namespace }} port-forward svc/{{ $name }} 8085:8080   then http://localhost:8085
# Logs in as the "{{ $name }}" KafkaUser and trusts Strimzi's cluster CA (PKCS#12 truststore from its Secret).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
    {{- include "supportsystem-kafka.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
        {{- include "supportsystem-kafka.labels" . | nindent 8 }}
    spec:
      containers:
        - name: kafka-ui
          image: {{ .Values.ui.image }}
          ports:
            - containerPort: 8080
              name: http
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /actuator/health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
          env:
            - name: KAFKA_CLUSTERS_0_NAME
              value: {{ .Values.clusterName }}
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: {{ printf "%s-kafka-bootstrap:9093" .Values.clusterName }}
            - name: KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL
              value: SASL_SSL
            - name: KAFKA_CLUSTERS_0_PROPERTIES_SASL_MECHANISM
              value: SCRAM-SHA-512
            - name: KAFKA_CLUSTERS_0_PROPERTIES_SASL_JAAS_CONFIG
              valueFrom:
                secretKeyRef:
                  name: {{ $name }}            # written by Strimzi's User Operator
                  key: sasl.jaas.config
            - name: KAFKA_CLUSTERS_0_PROPERTIES_SSL_TRUSTSTORE_TYPE
              value: PKCS12
            - name: KAFKA_CLUSTERS_0_PROPERTIES_SSL_TRUSTSTORE_LOCATION
              value: /etc/kafka-ca/ca.p12
            - name: KAFKA_CLUSTERS_0_PROPERTIES_SSL_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-cluster-ca-cert" .Values.clusterName }}
                  key: ca.password
          volumeMounts:
            - name: kafka-ca
              mountPath: /etc/kafka-ca
              readOnly: true
      volumes:
        - name: kafka-ca
          secret:
            secretName: {{ printf "%s-cluster-ca-cert" .Values.clusterName }}
            items:
              - key: ca.p12
                path: ca.p12
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
    {{- include "supportsystem-kafka.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: {{ $name }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}
