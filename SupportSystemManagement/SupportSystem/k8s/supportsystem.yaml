---
# ---------------------------------------------------------------------------
# ss-gateway-api (entry point - exposed outside the cluster, mirrors "5145:8080")
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ss-gateway-api
  namespace: supportsystem
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ss-gateway-api
  template:
    metadata:
      labels:
        app: ss-gateway-api
    spec:
      containers:
        - name: ss-gateway-api
          image: narendransekar/ss-gateway-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Docker" # selects ocelot.Docker.json, which already routes by these Service names
            - name: BaseUrl
              valueFrom:
                configMapKeyRef:
                  name: supportsystem-config
                  key: GATEWAY_BASE_URL
---
apiVersion: v1
kind: Service
metadata:
  name: ss-gateway-api
  namespace: supportsystem
spec:
  type: LoadBalancer
  selector:
    app: ss-gateway-api
  ports:
    - port: 5145
      targetPort: 8080

---
# ---------------------------------------------------------------------------
# ss-react-ui (exposed outside the cluster, mirrors "3000:80")
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ss-react-ui
  namespace: supportsystem
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ss-react-ui
  template:
    metadata:
      labels:
        app: ss-react-ui
    spec:
      containers:
        - name: ss-react-ui
          image: narendransekar/ss-react-ui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            - name: REACT_APP_GATEWAY_URL
              valueFrom:
                configMapKeyRef:
                  name: supportsystem-config
                  key: REACT_APP_GATEWAY_URL
---
apiVersion: v1
kind: Service
metadata:
  name: ss-react-ui
  namespace: supportsystem
spec:
  type: LoadBalancer
  selector:
    app: ss-react-ui
  ports:
    - port: 3000
      targetPort: 80
