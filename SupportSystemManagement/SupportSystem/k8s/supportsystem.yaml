apiVersion: v1
kind: Namespace
metadata:
  name: supportsystem

---
# Non-secret config shared across services (mirrors the plain env values in docker-compose.yml)
apiVersion: v1
kind: ConfigMap
metadata:
  name: supportsystem-config
  namespace: supportsystem
data:
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_VHOST: "/"
  # The browser only talks to the ingress (same origin), so no CORS/gateway URL is needed for the UI.
  # Set to the ingress URL if you also want to call the APIs from another origin.
  CORS_REACT_UI_ORIGIN: "http://localhost:3000"
  AUTH_USER_API_BASE_URL: "http://ss-user-api:8080"
  GATEWAY_BASE_URL: "http://ss-gateway-api:8080"

---
# Sensitive values - placeholders only, no credentials are committed. Set real values (same ones
# docker-compose.yml uses) before applying, e.g. via `kubectl create secret` (see README.md) or
# by editing these locally without committing them.
apiVersion: v1
kind: Secret
metadata:
  name: supportsystem-secrets
  namespace: supportsystem
type: Opaque
stringData:
  DB_CONNECTION_STRING: "REPLACE_ME"
  RABBITMQ_USERNAME: "guest"
  RABBITMQ_PASSWORD: "guest"

---
# ---------------------------------------------------------------------------
# rabbitmq
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: supportsystem
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management
          ports:
            - containerPort: 5672
              name: amqp
            - containerPort: 15672
              name: management
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: supportsystem-secrets
                  key: RABBITMQ_USERNAME
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: supportsystem-secrets
                  key: RABBITMQ_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: supportsystem
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672

---
# ---------------------------------------------------------------------------
# ss-auth-server-api
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ss-auth-server-api
  namespace: supportsystem
spec:
  # replicas is owned by the HorizontalPodAutoscaler below - setting it here would reset the
  # replica count on every `kubectl apply`.
  selector:
    matchLabels:
      app: ss-auth-server-api
  template:
    metadata:
      labels:
        app: ss-auth-server-api
    spec:
      containers:
        - name: ss-auth-server-api
          image: narendransekar/ss-auth-server-api:latest
          # Always: with :latest, IfNotPresent leaves old nodes on a stale image while newly scaled
          # pods pull the new one, so replicas would run different versions.
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:        # reserved for scheduling; the HPA's CPU % is measured against this
              cpu: 100m
              memory: 256Mi
            limits:          # CPU above this is throttled, memory above this is OOMKilled
              cpu: 500m
              memory: 512Mi
          startupProbe:      # gives .NET up to 60s to start before liveness kicks in
            httpGet:
              path: /health/live
              port: 8080
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:    # only route traffic to pods that are ready (important while scaling up)
            httpGet:
              path: /health/ready
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:     # restart a hung process
            httpGet:
              path: /health/live
              port: 8080
            periodSeconds: 20
            failureThreshold: 3
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Development"
            - name: UserApi__BaseUrl
              valueFrom:
                configMapKeyRef:
                  name: supportsystem-config
                  key: AUTH_USER_API_BASE_URL
---
apiVersion: v1
kind: Service
metadata:
  name: ss-auth-server-api
  namespace: supportsystem
spec:
  selector:
    app: ss-auth-server-api
  ports:
    - port: 8080
      targetPort: 8080

