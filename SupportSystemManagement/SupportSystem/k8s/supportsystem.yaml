# ---------------------------------------------------------------------------
# ss-gateway-api (reached from outside only through the ingress at /api)
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ss-gateway-api
  namespace: supportsystem
spec:
  # replicas is owned by the HorizontalPodAutoscaler below - setting it here would reset the
  # replica count on every `kubectl apply`.
  selector:
    matchLabels:
      app: ss-gateway-api
  template:
    metadata:
      labels:
        app: ss-gateway-api
    spec:
      containers:
        - name: ss-gateway-api
          image: narendransekar/ss-gateway-api:latest
          # Always: with :latest, IfNotPresent leaves old nodes on a stale image while newly scaled
          # pods pull the new one, so replicas would run different versions.
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:        # reserved for scheduling; the HPA's CPU % is measured against this
              cpu: 100m
              memory: 256Mi
            limits:          # CPU above this is throttled, memory above this is OOMKilled
              cpu: 500m
              memory: 512Mi
          startupProbe:      # gives .NET up to 60s to start before liveness kicks in
            httpGet:
              path: /health/live
              port: 8080
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:    # only route traffic to pods that are ready (important while scaling up)
            httpGet:
              path: /health/ready
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:     # restart a hung process
            httpGet:
              path: /health/live
              port: 8080
            periodSeconds: 20
            failureThreshold: 3
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Docker" # selects ocelot.Docker.json, which already routes by these Service names
            - name: BaseUrl
              valueFrom:
                configMapKeyRef:
                  name: supportsystem-config
                  key: GATEWAY_BASE_URL
---
apiVersion: v1
kind: Service
metadata:
  name: ss-gateway-api
  namespace: supportsystem
spec:
  selector:
    app: ss-gateway-api
  ports:
    - port: 8080
      targetPort: 8080

---
# ---------------------------------------------------------------------------
# ss-react-ui (reached from outside only through the ingress at /)
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ss-react-ui
  namespace: supportsystem
spec:
  # replicas is owned by the HorizontalPodAutoscaler below - setting it here would reset the
  # replica count on every `kubectl apply`.
  selector:
    matchLabels:
      app: ss-react-ui
  template:
    metadata:
      labels:
        app: ss-react-ui
    spec:
      containers:
        - name: ss-react-ui
          image: narendransekar/ss-react-ui:latest
          # Always: a :latest tag with IfNotPresent lets a node keep a stale cached image forever.
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ss-react-ui
  namespace: supportsystem
spec:
  selector:
    app: ss-react-ui
  ports:
    - port: 80
      targetPort: 80

---
# ---------------------------------------------------------------------------
# Ingress (single public entry point via the ingress-nginx controller's one load balancer)
#   /api -> ss-gateway-api, everything else -> ss-react-ui
# ---------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: supportsystem-ingress
  namespace: supportsystem
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: ss-gateway-api
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ss-react-ui
                port:
                  number: 80

---
# ---------------------------------------------------------------------------
# Autoscaling (HorizontalPodAutoscaler)
#   Requires metrics-server in the cluster (see README.md) and resources.requests on the containers.
#   Scales on CPU only: .NET's GC keeps memory high after load drops, so memory-based scaling
#   would scale up and never come back down.
#   rabbitmq is deliberately NOT autoscaled - extra replicas would be separate brokers.
# ---------------------------------------------------------------------------
# ss-gateway-api: every request goes through here
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ss-gateway-api
  namespace: supportsystem
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ss-gateway-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0     # react to spikes immediately
    scaleDown:
      stabilizationWindowSeconds: 300   # only scale down after 5 min of consistently lower load
      policies:
        - type: Pods
          value: 1                      # remove at most 1 pod per minute
          periodSeconds: 60

