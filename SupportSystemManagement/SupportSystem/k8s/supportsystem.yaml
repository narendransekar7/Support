# ---------------------------------------------------------------------------
# PodDisruptionBudgets: during voluntary disruptions (AKS upgrades, node drains, cluster-autoscaler
# scale-in) keep at least one pod of each service running instead of evicting all at once.
#   Not added for ss-email-api / rabbitmq: they can run a single replica, and minAvailable: 1 on a
#   single pod would block node drains (and AKS upgrades) forever.
# ---------------------------------------------------------------------------
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ss-gateway-api
  namespace: supportsystem
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ss-gateway-api

