          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: ss-react-ui
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: ss-react-ui
      containers:
        - name: ss-react-ui
          image: narendransekar/ss-react-ui:latest
          # Always: a :latest tag with IfNotPresent lets a node keep a stale cached image forever.
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          env:
            # Written into /config.js at container start - see supportsystem.reactui/docker-entrypoint.d.
            - name: APPLICATIONINSIGHTS_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: supportsystem-secrets
                  key: APPLICATIONINSIGHTS_CONNECTION_STRING
                  optional: true
            - name: ENTRA_TENANT_ID
              valueFrom:
                configMapKeyRef:
                  name: supportsystem-config
                  key: ENTRA_TENANT_ID
            - name: ENTRA_SPA_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: supportsystem-config
                  key: ENTRA_SPA_CLIENT_ID
            - name: ENTRA_API_SCOPE
              valueFrom:
                configMapKeyRef:
                  name: supportsystem-config
                  key: ENTRA_API_SCOPE
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ss-react-ui
  namespace: supportsystem
spec:
  selector:
    app: ss-react-ui
  ports:
    - port: 80
      targetPort: 80

---
# ---------------------------------------------------------------------------
# Ingress (single public entry point - the controller's one Azure load balancer / public IP)
#   /api -> ss-gateway-api, everything else -> ss-react-ui
#   Served by the community ingress-nginx controller (IngressClass "nginx"), installed once per
#   cluster - see README.md step 2:
#     kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.15.1/deploy/static/provider/cloud/deploy.yaml
#   To use the AKS application routing add-on instead, change the class to
#   "webapprouting.kubernetes.azure.com" (az aks approuting enable -g <resource-group> -n <cluster>).
# ---------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: supportsystem-ingress
  namespace: supportsystem
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: ss-gateway-api
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ss-react-ui
                port:
                  number: 80

---
# ---------------------------------------------------------------------------
# Autoscaling (HorizontalPodAutoscaler)
#   Requires metrics-server in the cluster (see README.md) and resources.requests on the containers.
#   Scales on CPU only: .NET's GC keeps memory high after load drops, so memory-based scaling
#   would scale up and never come back down.
#   rabbitmq is deliberately NOT autoscaled - extra replicas would be separate brokers.
# ---------------------------------------------------------------------------
# ss-gateway-api: every request goes through here
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ss-gateway-api
  namespace: supportsystem
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ss-gateway-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0     # react to spikes immediately
    scaleDown:
      stabilizationWindowSeconds: 300   # only scale down after 5 min of consistently lower load
      policies:
        - type: Pods
          value: 1                      # remove at most 1 pod per minute
          periodSeconds: 60

