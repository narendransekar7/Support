services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: supportsystem-rabbitmq
    ports:
      - "5672:5672"   # AMQP (used by MassTransit)
      - "15672:15672" # Management UI (guest/guest) - http://localhost:15672
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
